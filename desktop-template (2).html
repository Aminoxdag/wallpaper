<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قالب سطح المكتب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0b0d12;--panel:#14171f;--panel2:#1a1e28;--line:#262b38;--tx:#eef0f6;--mut:#8b93a7;
  --ac:#6c8cff;--ac2:#a06cff;--ok:#3ddc97;--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:radial-gradient(1200px 600px at 85% -10%,rgba(108,140,255,.14),transparent 60%),
             radial-gradient(900px 500px at 0% 110%,rgba(160,108,255,.10),transparent 60%),var(--bg);
  color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",system-ui,sans-serif;min-height:100vh;
}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 24px rgba(108,140,255,.35)}
.logo svg{width:22px;height:22px;stroke:#fff}
h1{font-size:19px;margin:0;font-weight:700}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.chip{margin-inline-start:auto;font-size:12px;color:var(--mut);border:1px solid var(--line);
  padding:6px 12px;border-radius:999px;background:var(--panel);white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

/* monitor frame */
.monitor{background:#05060a;border:1px solid var(--line);border-radius:18px;padding:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.03)}
.screen{position:relative;border-radius:10px;overflow:hidden;background:#000;line-height:0;touch-action:none}
canvas{display:block;width:100%;height:auto}
canvas.can-pan{cursor:grab}canvas.can-pan:active{cursor:grabbing}
.empty{position:absolute;inset:0;display:grid;place-items:center;line-height:1.5;
  background:rgba(8,10,16,.55);backdrop-filter:blur(3px);cursor:pointer;transition:.25s}
.empty.hide{opacity:0;pointer-events:none}
.empty .box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 30px;
  border:2px dashed rgba(255,255,255,.28);border-radius:16px;text-align:center}
.empty svg{width:34px;height:34px;stroke:#fff;opacity:.9}
.empty b{font-size:16px}.empty span{font-size:12.5px;color:#b9c0d4}
.screen.drag .empty{background:rgba(108,140,255,.28)}
.hint{font-size:12px;color:var(--mut);margin:10px 4px 0;display:flex;gap:6px;align-items:center}

/* side panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.sec{padding:14px 12px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 10px;font-size:12px;letter-spacing:.3px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.sec h3 svg{width:14px;height:14px}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:11px;
  padding:11px 14px;font:inherit;font-size:14px;font-weight:600;transition:.18s}
.btn:hover{border-color:#3a4256;background:#202534}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;box-shadow:0 8px 22px rgba(108,140,255,.3)}
.btn.pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;margin-top:8px;font-weight:400;font-size:13px;color:var(--mut)}
.fname{font-size:12px;color:var(--mut);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel2);border:1px solid var(--line);
  border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;padding:8px 6px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button.on{background:#2b3250;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:12px 0 6px}
.row:first-of-type{margin-top:0}
.row output{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:9px;background:var(--line);outline:0;direction:ltr}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;
  border:3px solid var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ac);cursor:pointer}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-start:6px;border:1px solid rgba(255,255,255,.3)}
input[type=file]{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:#1d2230;border:1px solid var(--line);
  padding:10px 18px;border-radius:999px;font-size:13px;transition:.3s;pointer-events:none;display:flex;gap:8px;align-items:center;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
    <div><h1>قالب سطح المكتب</h1><div class="sub">غيّر الخلفية فقط، وكل شيء آخر يبقى كما هو</div></div>
    <div class="chip">1366 × 768</div>
  </header>

  <div class="grid">
    <div>
      <div class="monitor">
        <div class="screen" id="screen">
          <canvas id="c" width="1366" height="768"></canvas>
          <div class="empty" id="empty">
            <div class="box">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
              <b>اسحب صورة الخلفية هنا</b>
              <span>أو اضغط للاختيار، أو الصق صورة بـ Ctrl+V</span>
            </div>
          </div>
        </div>
      </div>
      <div class="hint" id="hint">الأيقونات ثابتة، والتاسك بار شفاف يتأثر بألوان خلفيتك مثل ويندوز.</div>
    </div>

    <aside class="panel">
      <div class="sec">
        <h3>الخلفية</h3>
        <button class="btn pri" id="pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>رفع صورة</button>
        <div class="fname" id="fname">لم يتم اختيار صورة</div>
        <input id="file" type="file" accept="image/*">
      </div>
      <div class="sec">
        <h3>الملاءمة</h3>
        <div class="seg" id="fitSeg">
          <button data-v="cover" class="on">ملء</button>
          <button data-v="contain">احتواء</button>
          <button data-v="fill">تمديد</button>
        </div>
        <button class="btn ghost" id="reset">إعادة الموضع للمنتصف</button>
      </div>
      <div class="sec">
        <h3>التاسك بار</h3>
        <div class="row"><span>التعتيم</span><output id="tintV">80%</output></div>
        <input id="tint" type="range" min="60" max="100" value="80">
        <div class="row"><span>الضبابية</span><output id="blurV">28</output></div>
        <input id="blur" type="range" min="0" max="48" value="28">
        <div class="row"><span>لون مؤشر التطبيق<i class="swatch" id="sw"></i></span></div>
        <div class="seg" id="accSeg">
          <button data-v="auto" class="on">من الخلفية</button>
          <button data-v="gray">رمادي</button>
        </div>
      </div>
      <div class="sec">
        <button class="btn pri" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>تصدير PNG</button>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"><i></i><span id="toastT"></span></div>

const W=1366,H=768,TB=40;
const $=id=>document.getElementById(id);
const cv=$("c"),ctx=cv.getContext("2d"),screen=$("screen");
const layers={};
let wp=null,fit="cover",px=.5,py=.5,tint=.8,blur=28,accMode="auto",accent="#c9c9c9";

const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});
Promise.all(Object.entries(IMG).map(async([k,v])=>layers[k]=await load(v))).then(render);

function drawWallpaper(){
  if(!wp){
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#1c2a44");g.addColorStop(.55,"#3a2a5c");g.addColorStop(1,"#12151f");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);return;
  }
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  const iw=wp.naturalWidth,ih=wp.naturalHeight;
  if(fit==="fill"){ctx.drawImage(wp,0,0,W,H);return}
  const s=fit==="cover"?Math.max(W/iw,H/ih):Math.min(W/iw,H/ih);
  const w=iw*s,h=ih*s;
  ctx.drawImage(wp,(W-w)*px,(H-h)*py,w,h);
}
/* frosted taskbar: pure-JS blur (works on every browser, no ctx.filter needed) */
function boxBlur(d,w,h,r){
  const n=2*r+1,tmp=new Uint8ClampedArray(d.length);
  for(let y=0;y<h;y++)for(let c=0;c<3;c++){
    const row=y*w*4+c;let sum=0;
    for(let k=-r;k<=r;k++)sum+=d[row+Math.min(w-1,Math.max(0,k))*4];
    for(let x=0;x<w;x++){
      tmp[row+x*4]=sum/n;
      sum+=d[row+Math.min(w-1,x+r+1)*4]-d[row+Math.max(0,x-r)*4];
    }
  }
  for(let x=0;x<w;x++)for(let c=0;c<3;c++){
    const col=x*4+c;let sum=0;
    for(let k=-r;k<=r;k++)sum+=tmp[Math.min(h-1,Math.max(0,k))*w*4+col];
    for(let y=0;y<h;y++){
      d[y*w*4+col]=sum/n;
      sum+=tmp[Math.min(h-1,y+r+1)*w*4+col]-tmp[Math.max(0,y-r)*w*4+col];
    }
  }
}
function glass(){
  const y=H-TB,pad=48,f=4;
  if(blur>0){
    const sh=TB+pad,tw=Math.round(W/f),th=sh/f;
    // downscale in two steps for a smoother base
    const a=document.createElement("canvas");a.width=W/2;a.height=sh/2;
    const ax=a.getContext("2d");ax.imageSmoothingQuality="high";ax.drawImage(cv,0,y-pad,W,sh,0,0,a.width,a.height);
    const t=document.createElement("canvas");t.width=tw;t.height=th;
    const tx=t.getContext("2d");tx.imageSmoothingQuality="high";tx.drawImage(a,0,0,tw,th);
    const im=tx.getImageData(0,0,tw,th),d=im.data,r=Math.max(1,Math.round(blur/f));
    for(let i=0;i<3;i++)boxBlur(d,tw,th,r);
    for(let i=0;i<d.length;i+=4){            // slight saturation boost like Windows acrylic
      const g=.3*d[i]+.59*d[i+1]+.11*d[i+2];
      d[i]=g+(d[i]-g)*1.6;d[i+1]=g+(d[i+1]-g)*1.6;d[i+2]=g+(d[i+2]-g)*1.6;
    }
    tx.putImageData(im,0,0);
    ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
    ctx.drawImage(t,0,pad/f,tw,TB/f,0,y,W,TB);ctx.restore();
  }
  ctx.fillStyle="rgba(35,35,35,"+tint+")";ctx.fillRect(0,y,W,TB);
}
function render(){
  if(!layers.icons)return;
  ctx.clearRect(0,0,W,H);
  drawWallpaper();
  glass();
  ctx.save();ctx.shadowColor="rgba(0,0,0,.75)";ctx.shadowBlur=3;ctx.shadowOffsetY=1;
  ctx.drawImage(layers.icons,0,0);ctx.restore();
  ctx.drawImage(layers.left,0,H-TB);
  ctx.drawImage(layers.tray,W-layers.tray.width,H-TB);
  ctx.fillStyle=accMode==="auto"?accent:"#c9c9c9";ctx.fillRect(347,H-3,40,3);
  ctx.fillStyle="#4a4a4a";ctx.fillRect(W-4,H-TB,1,TB);
  $("sw").style.background=accMode==="auto"?accent:"#c9c9c9";
  cv.classList.toggle("can-pan",!!wp&&fit==="cover");
}

/* accent colour from wallpaper (weighted by saturation) */
function computeAccent(){
  const t=document.createElement("canvas");t.width=48;t.height=27;
  const x=t.getContext("2d");x.drawImage(wp,0,0,48,27);
  const d=x.getImageData(0,0,48,27).data;let r=0,g=0,b=0,wsum=0;
  for(let i=0;i<d.length;i+=4){
    const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);
    const w=(mx-mn)/255*(mx/255);r+=d[i]*w;g+=d[i+1]*w;b+=d[i+2]*w;wsum+=w;
  }
  if(wsum<1){accent="#c9c9c9";return}
  r/=wsum;g/=wsum;b/=wsum;
  // to HSL, then fix lightness for a readable indicator
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const dd=mx-mn;s=l>.5?dd/(2-mx-mn):dd/(mx+mn);
    h=mx===r?(g-b)/dd+(g<b?6:0):mx===g?(b-r)/dd+2:(r-g)/dd+4;h*=60}
  if(s<.15){accent="#c9c9c9";return}
  accent="hsl("+Math.round(h)+","+Math.round(Math.min(100,s*100+10))+"%,68%)";
}

function toast(t){const e=$("toast");$("toastT").textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function loadFile(f){
  if(!f||!f.type.startsWith("image/"))return;
  const i=new Image();
  i.onload=()=>{wp=i;px=py=.5;computeAccent();$("empty").classList.add("hide");
    $("fname").textContent="\u2066"+(f.name||"pasted image")+"\u2069  ·  "+i.naturalWidth+"\u00d7"+i.naturalHeight;render()};
  i.src=URL.createObjectURL(f);
}

$("file").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};

/* drag & drop + paste */
["dragenter","dragover"].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();screen.classList.add("drag");$("empty").classList.remove("hide")}));
["dragleave","drop"].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();screen.classList.remove("drag");if(wp)$("empty").classList.add("hide")}));
window.addEventListener("drop",e=>loadFile(e.dataTransfer.files[0]));
window.addEventListener("paste",e=>{for(const it of e.clipboardData.items)if(it.type.startsWith("image/")){loadFile(it.getAsFile());break}});

/* controls */
function seg(id,cb){const s=$(id);s.onclick=e=>{const b=e.target.closest("button");if(!b)return;
  s.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));cb(b.dataset.v)}}
seg("fitSeg",v=>{fit=v;render()});
seg("accSeg",v=>{accMode=v;render()});
$("tint").oninput=e=>{tint=e.target.value/100;$("tintV").textContent=e.target.value+"%";render()};
$("blur").oninput=e=>{blur=+e.target.value;$("blurV").textContent=blur;render()};
$("reset").onclick=()=>{px=py=.5;render()};
$("save").onclick=()=>{
  cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="desktop.png";a.click();toast("تم حفظ الصورة 1366×768")},"image/png");
};

/* drag to pan the wallpaper */
let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,px,py};cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{
  if(!drag||!wp||fit!=="cover")return;
  const r=cv.getBoundingClientRect(),k=W/r.width;
  const s=Math.max(W/wp.naturalWidth,H/wp.naturalHeight);
  const ox=wp.naturalWidth*s-W,oy=wp.naturalHeight*s-H;
  if(ox>0)px=Math.min(1,Math.max(0,drag.px-((e.clientX-drag.x)*k)/ox));
  if(oy>0)py=Math.min(1,Math.max(0,drag.py-((e.clientY-drag.y)*k)/oy));
  render();
});
["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev,()=>drag=null));
</script>
